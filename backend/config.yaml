llm:
  default_provider: openai
  default_model: gpt-4o-mini
  rate_limits:
    openai:
      requests_per_minute: 60
      tokens_per_minute: 100000
    anthropic:
      requests_per_minute: 50
      tokens_per_minute: 80000
    ollama:
      requests_per_minute: 120
      tokens_per_minute: 0  # no limit for local
    lmstudio:
      requests_per_minute: 120
      tokens_per_minute: 0  # no limit for local

eval_runner:
  max_concurrency: 5
  retry_max_attempts: 3
  retry_base_delay: 1.0
  retry_max_delay: 10.0
  # Max trace content size. Chars = max_trace_tokens * 1.5. For 58k context use 32000; 0 = no truncation.
  max_trace_tokens: 32000
  # Hard cap on total prompt length (chars). Ensures no request exceeds context. For 58k n_ctx use 80000; 0 = no cap.
  max_prompt_chars: 80000
